<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ETTER II — iframe host</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #111;
      }

      iframe {
        display: block;
        width: 100%;
        height: 100%;
        border: 0;
      }
    </style>
  </head>
  <body>
    <!--
      Cargo / kaik.pictures embed (GitHub Pages — works in Russia):

      <iframe
        src="https://fovkotov.github.io/kaik/"
        title="ETTER II"
        style="width:100%;height:100vh;border:0;display:block;"
        allow="autoplay; clipboard-write"
        loading="eager"
      ></iframe>

      Backup: npm run build:cargo → upload dist/kaik.html to Cargo Files.
    -->
    <iframe src="/" title="ETTER II" allow="autoplay; clipboard-write"></iframe>
  </body>
</html>
