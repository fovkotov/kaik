<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Эксперимент 2 — Käik</title>
    <script>
      /* Scriptik boot: lock html lang to the browser (or saved choice) before paint. */
      (function () {
        var KEY = "kaik-course-locale";
        var SUPPORTED = { en: 1, ru: 1 };
        function pick(value) {
          if (!value) return null;
          var base = String(value).toLowerCase().split("-")[0];
          return SUPPORTED[base] ? base : null;
        }
        var locale = null;
        try {
          locale = pick(localStorage.getItem(KEY));
        } catch (e) {}
        if (!locale) {
          var list = navigator.languages || [];
          for (var i = 0; i < list.length; i++) {
            locale = pick(list[i]);
            if (locale) break;
          }
          if (!locale) {
            locale = pick(navigator.language) || pick(navigator.userLanguage);
          }
        }
        locale = locale || "en";
        document.documentElement.lang = locale;
        document.documentElement.setAttribute("data-locale", locale);
        document.documentElement.classList.toggle("lang-ru", locale === "ru");
      })();
    </script>
    <link
      rel="icon"
      href="https://freight.cargo.site/t/original/i/H2765952418214795329571591071100/kaik_favicon.ico"
    />
    <link rel="stylesheet" href="/src/experiment-2.css" />
  </head>
  <body class="experiment-two">
    <div class="experiment-two__scroll" data-scroll-root>
      <div class="experiment-two__content" data-scroll-content>
      <main class="works-page">
        <section class="lettering-hero" data-lettering-hero aria-label="Интерактивный леттеринг">
          <!-- Scooter mark above the two-line caption (Figma 243:95948). Desktop: the loader, gone once
               the first SVG is ready. Mobile (≤760px): stays as the static illustration block — no
               interactive hero is rendered or loaded there. -->
          <div class="lettering-hero__loader" aria-hidden="true">
            <img class="lettering-hero__loader-mark" src="/assets/author/exp2-loader.svg" alt="" width="92" height="111" draggable="false" />
            <p class="lettering-hero__loader-text">letterfolio<br />by letter course students</p>
          </div>
          <img class="lettering-hero__image" data-lettering-image alt="" draggable="false" />
          <button
            class="lettering-hero__action"
            data-lettering-action
            type="button"
            aria-label="Показать следующий леттеринг"
            data-i18n-aria="exp2.nextHero"
          ></button>
          <p class="lettering-hero__credit" data-lettering-credit aria-live="polite"></p>
        </section>

        <!-- Desktop: about | filter island | signup + language.
             Mobile: island + about stick up top; signup + language live in
             the fixed bottom bar (data-mobile-bar). -->
        <div class="filter-bar" data-filter-bar>
          <a
            class="filter-chip filter-chip--about filter-bar__side filter-bar__side--start"
            href="https://kaik.pictures/"
            target="_top"
            rel="noopener noreferrer"
            data-about
            aria-label="О курсе"
            data-i18n-aria="exp2.about"
          >
            <span class="filter-chip__plate">
              <span data-i18n="exp2.about">о курсе</span>
              <img class="filter-chip__arrow" src="/assets/author/exp2-about-arrow.svg" alt="" width="12" height="20" draggable="false" aria-hidden="true" />
            </span>
          </a>

          <div class="filter-island" data-filter-island role="group" aria-label="Фильтры работ" data-i18n-aria="exp2.filters">
            <button class="filter-chip filter-chip--daily" type="button" role="checkbox" aria-checked="true" data-filter="daily">
              <span class="filter-chip__plate" data-i18n="exp2.filter.daily">daily practice</span>
            </button>
            <button class="filter-chip filter-chip--lettering" type="button" role="checkbox" aria-checked="true" data-filter="lettering">
              <span class="filter-chip__plate" data-i18n="exp2.filter.workshop">воркшопы</span>
            </button>
            <button class="filter-chip filter-chip--final" type="button" role="checkbox" aria-checked="true" data-filter="final">
              <span class="filter-chip__plate" data-i18n="exp2.filter.final">финальные проекты</span>
            </button>
            <button class="filter-chip filter-chip--font" type="button" role="checkbox" aria-checked="true" data-filter="font">
              <span class="filter-chip__plate" data-i18n="exp2.filter.font">шрифты</span>
            </button>
          </div>

          <div class="filter-bar__cluster filter-bar__side filter-bar__side--end">
            <a
              class="filter-chip filter-chip--enroll"
              href="https://docs.google.com/forms/d/e/1FAIpQLSfghzk5zivpA0fB3yL9lNfX7ONCcNE612S6hqAQzx4amfG9dQ/viewform"
              target="_blank"
              rel="noopener noreferrer"
              data-enroll
            >
              <span class="filter-chip__plate" data-i18n="exp2.enroll">join waitlist</span>
            </a>
            <button
              class="filter-chip filter-chip--lang"
              type="button"
              data-lang-toggle
              aria-label="Переключить язык"
              data-i18n-aria="exp2.lang"
            >
              <span class="filter-chip__plate" data-lang-label>en</span>
            </button>
          </div>
        </div>

        <section class="works-panel" aria-label="Работы студентов">
          <div class="works-grid" data-works-grid></div>
          <p class="works-empty" data-works-empty hidden data-i18n="exp2.empty">ничего нет</p>
        </section>
      </main>
      </div>
    </div>

    <!-- Mobile only: signup + language pinned to the bottom of the iframe. Sibling of the
         scroll root so position: fixed sticks to the frame, not the scroller. -->
    <div class="mobile-bar" data-mobile-bar>
      <a
        class="filter-chip filter-chip--enroll"
        href="https://docs.google.com/forms/d/e/1FAIpQLSfghzk5zivpA0fB3yL9lNfX7ONCcNE612S6hqAQzx4amfG9dQ/viewform"
        target="_blank"
        rel="noopener noreferrer"
        data-enroll
      >
        <span class="filter-chip__plate" data-i18n="exp2.enroll">join waitlist</span>
      </a>
      <button
        class="filter-chip filter-chip--lang"
        type="button"
        data-lang-toggle
        aria-label="Переключить язык"
        data-i18n-aria="exp2.lang"
      >
        <span class="filter-chip__plate" data-lang-label>en</span>
      </button>
    </div>

    <aside class="grid-settings" data-grid-settings hidden aria-label="Настройки сетки">
      <div class="grid-settings__head">
        <strong>grid</strong>
        <button type="button" data-grid-settings-close aria-label="Закрыть">×</button>
      </div>
      <div class="grid-settings__geometry">
        <label>columns <input name="columns" type="number" min="2" max="12" step="1" /></label>
        <label>columns (mobile) <input name="mobileColumns" type="number" min="1" max="12" step="1" /></label>
        <label>hero height (vh) <input name="heroVh" type="number" min="20" max="200" step="1" /></label>
        <label>illustration height (vh, mobile) <input name="heroVhMobile" type="number" min="20" max="200" step="1" /></label>
        <label>W/H <input name="cellRatio" type="number" min="0.25" max="4" step="0.01" /></label>
        <label>gap X <input name="gapX" type="number" min="0" max="80" step="1" /></label>
        <label>gap Y <input name="gapY" type="number" min="0" max="80" step="1" /></label>
      </div>
      <fieldset class="grid-settings__align">
        <legend>content alignment</legend>
        <div class="grid-settings__align-grid" data-grid-alignment>
          <button type="button" data-align="start,start" aria-label="Сверху слева"></button>
          <button type="button" data-align="center,start" aria-label="Сверху по центру"></button>
          <button type="button" data-align="end,start" aria-label="Сверху справа"></button>
          <button type="button" data-align="start,center" aria-label="Слева по центру"></button>
          <button type="button" data-align="center,center" aria-label="По центру"></button>
          <button type="button" data-align="end,center" aria-label="Справа по центру"></button>
          <button type="button" data-align="start,end" aria-label="Снизу слева"></button>
          <button type="button" data-align="center,end" aria-label="Снизу по центру"></button>
          <button type="button" data-align="end,end" aria-label="Снизу справа"></button>
        </div>
      </fieldset>
      <div class="grid-settings__patterns">
        <fieldset data-pattern="daily">
          <legend>daily</legend>
          <label>base span <input name="baseSpan" type="number" min="1" max="12" step="1" /></label>
          <label>every <input name="interval" type="number" min="1" max="99" step="1" /></label>
          <label>large span <input name="span" type="number" min="1" max="12" step="1" /></label>
        </fieldset>
        <fieldset data-pattern="lettering">
          <legend>workshop</legend>
          <label>base span <input name="baseSpan" type="number" min="1" max="12" step="1" /></label>
          <label>every <input name="interval" type="number" min="1" max="99" step="1" /></label>
          <label>large span <input name="span" type="number" min="1" max="12" step="1" /></label>
        </fieldset>
        <fieldset data-pattern="final">
          <legend>final</legend>
          <label>base span <input name="baseSpan" type="number" min="1" max="12" step="1" /></label>
          <label>every <input name="interval" type="number" min="1" max="99" step="1" /></label>
          <label>large span <input name="span" type="number" min="1" max="12" step="1" /></label>
        </fieldset>
        <fieldset data-pattern="font">
          <legend>font · fixed</legend>
          <label>base span <input name="baseSpan" type="number" min="1" max="12" step="1" /></label>
        </fieldset>
      </div>
      <label class="grid-settings__toggle">
        <input name="dense" type="checkbox" />
        dense packing (backfill holes)
      </label>
      <button class="grid-settings__reset" type="button" data-grid-settings-reset>Reset to catalog defaults</button>
    </aside>

    <div
      class="viewer"
      data-viewer
      hidden
      inert
      aria-hidden="true"
      role="dialog"
      aria-modal="true"
      aria-label="Просмотр работы"
    >
      <figure class="viewer__stage" data-viewer-track></figure>
      <button type="button" class="viewer__hit viewer__hit--prev" data-viewer-prev aria-label="Предыдущий слайд">
        <span class="viewer__arrow" aria-hidden="true">
          <img class="viewer__chevron" src="/assets/author/exp2-chevron.svg" alt="" width="34" height="34" draggable="false" />
        </span>
      </button>
      <div class="viewer__hit viewer__hit--mid" data-viewer-mid></div>
      <button type="button" class="viewer__hit viewer__hit--next" data-viewer-next aria-label="Следующий слайд">
        <span class="viewer__arrow" aria-hidden="true">
          <img class="viewer__chevron" src="/assets/author/exp2-chevron.svg" alt="" width="34" height="34" draggable="false" />
        </span>
      </button>
      <button type="button" class="viewer__close" data-viewer-close aria-label="Закрыть">
        <img src="/assets/author/exp2-close.svg" alt="" width="34" height="34" draggable="false" />
      </button>
      <p class="viewer__caption" data-viewer-caption></p>
      <div class="viewer__dots" data-viewer-dots role="tablist"></div>
    </div>

    <script type="module" src="/src/experiment-2.js"></script>
  </body>
</html>
