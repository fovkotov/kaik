<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Эксперимент 2 — Käik</title>
    <link
      rel="icon"
      href="https://freight.cargo.site/t/original/i/H2765952418214795329571591071100/kaik_favicon.ico"
    />
    <link rel="stylesheet" href="/src/experiment-2.css" />
  </head>
  <body class="experiment-two">
    <div class="experiment-two__scroll" data-scroll-root>
      <header class="site-nav">
        <a class="site-nav__brand" href="https://kaik.pictures/main" target="_top" rel="noreferrer">
          Käik: we make cool stuff <span aria-hidden="true">→</span>
        </a>
        <nav class="site-nav__links" aria-label="Käik">
          <a href="https://kaik.pictures/main" target="_top" rel="noreferrer">Main</a>
          <a href="https://kaik.pictures/education" target="_top" rel="noreferrer">Education</a>
          <a href="https://kaik.pictures/feed" target="_top" rel="noreferrer">Feed</a>
          <a class="is-muted" href="https://kaik.pictures/tools" target="_top" rel="noreferrer">Tools</a>
        </nav>
        <a href="https://kaik.pictures/information" target="_top" rel="noreferrer">Information</a>
      </header>

      <main class="works-page">
        <section class="lettering-hero" data-lettering-hero aria-label="Интерактивный леттеринг">
          <canvas class="lettering-hero__canvas" data-lettering-canvas aria-hidden="true"></canvas>
          <img class="lettering-hero__fallback" data-lettering-fallback alt="" draggable="false" />
          <button
            class="lettering-hero__action"
            data-lettering-action
            type="button"
            aria-label="Показать следующий леттеринг"
          ></button>
          <p class="lettering-hero__credit" data-lettering-credit aria-live="polite"></p>
        </section>

        <section class="review-hero" data-review-hero hidden aria-labelledby="review-title">
          <h1 class="review-hero__title" id="review-title">финальный просмотр 1&nbsp;потока</h1>
          <div class="review-hero__video" data-review-video>
            <button class="review-hero__play" type="button" data-review-play aria-label="Смотреть запись финального просмотра">
              <span class="review-hero__play-icon" aria-hidden="true"></span>
            </button>
          </div>
        </section>

        <div class="works-tabs" role="tablist" aria-label="Разделы">
          <button
            class="works-tab is-on"
            type="button"
            role="tab"
            id="tab-lettering"
            aria-selected="true"
            aria-controls="works-panel"
            data-tab="lettering"
          >
            воркшопы
          </button>
          <button
            class="works-tab"
            type="button"
            role="tab"
            id="tab-final"
            aria-selected="false"
            aria-controls="works-panel"
            data-tab="final"
          >
            финальные проекты
          </button>
        </div>

        <section class="works-panel" role="tabpanel" id="works-panel" data-works-panel aria-labelledby="tab-lettering">
          <div class="works-grid" data-works-grid></div>
          <p class="works-empty" data-works-empty hidden>Здесь пока нет работ.</p>
        </section>
      </main>
    </div>

    <div
      class="viewer"
      data-viewer
      hidden
      inert
      aria-hidden="true"
      role="dialog"
      aria-modal="true"
      aria-label="Просмотр работы"
    >
      <figure class="viewer__stage" data-viewer-track></figure>
      <button type="button" class="viewer__hit viewer__hit--prev" data-viewer-prev aria-label="Предыдущий слайд">
        <span class="viewer__arrow" aria-hidden="true">
          <img class="viewer__chevron" src="/assets/author/lb-chevron.svg" alt="" width="20" height="20" draggable="false" />
        </span>
      </button>
      <div class="viewer__hit viewer__hit--mid" data-viewer-mid></div>
      <button type="button" class="viewer__hit viewer__hit--next" data-viewer-next aria-label="Следующий слайд">
        <span class="viewer__arrow" aria-hidden="true">
          <img class="viewer__chevron" src="/assets/author/lb-chevron.svg" alt="" width="20" height="20" draggable="false" />
        </span>
      </button>
      <button type="button" class="viewer__close" data-viewer-close aria-label="Закрыть">
        <img src="/assets/author/lb-close.svg" alt="" width="24" height="24" draggable="false" />
      </button>
      <p class="viewer__caption" data-viewer-caption></p>
      <p class="viewer__counter" data-viewer-counter></p>
      <div class="viewer__dots" data-viewer-dots role="tablist"></div>
    </div>

    <script type="module" src="/src/experiment-2.js"></script>
  </body>
</html>
