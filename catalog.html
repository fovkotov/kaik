<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Catalog — Käik</title>
    <link
      rel="icon"
      href="https://freight.cargo.site/t/original/i/H2765952418214795329571591071100/kaik_favicon.ico"
    />
    <link rel="stylesheet" href="/src/styles.css" />
    <link rel="stylesheet" href="/src/catalog/catalog.css" />
    <script>
      (function () {
        var KEY = "kaik-course-locale";
        var SUPPORTED = { en: 1, ru: 1 };
        function pick(value) {
          if (!value) return null;
          var base = String(value).toLowerCase().split("-")[0];
          return SUPPORTED[base] ? base : null;
        }
        var locale = null;
        try {
          locale = pick(localStorage.getItem(KEY));
        } catch (e) {}
        if (!locale) {
          var list = navigator.languages || [];
          for (var i = 0; i < list.length; i++) {
            locale = pick(list[i]);
            if (locale) break;
          }
          if (!locale) {
            locale = pick(navigator.language) || pick(navigator.userLanguage);
          }
        }
        locale = locale || "en";
        document.documentElement.lang = locale;
        document.documentElement.setAttribute("data-locale", locale);
      })();
    </script>
  </head>
  <body class="catalog">
    <div id="catalog-root"></div>
    <script type="module" src="/src/catalog/main.tsx"></script>
  </body>
</html>
